name: Temporary Fallline generated-level qualification
on:
  push:
    branches: [qa/fallline-generated-20261115]
permissions:
  contents: read
concurrency:
  group: fallline-generated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generated:
    if: github.ref == 'refs/heads/qa/fallline-generated-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Define owned output
        shell: bash
        run: echo "FALLLINE_OUTPUT=$RUNNER_TEMP/fallline-generated-proof-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Exact source generated gameplay and owned teardown
        run: python3 tests/scripts/generated-v1-qa.py
      - name: Preserve original bounded output
        if: always()
        run: node tests/scripts/emit-generated-proof.mjs
      - name: Preserve original artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fallline-generated-proof
          path: ${{ env.FALLLINE_OUTPUT }}
          retention-days: 7
