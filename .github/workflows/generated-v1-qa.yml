name: Temporary Fallline generated-level qualification
on:
  push:
    branches: [qa/fallline-generated-20261115]
permissions:
  contents: read
concurrency:
  group: fallline-generated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retire:
    if: github.ref == 'refs/heads/qa/fallline-generated-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Retire exact owned workflow/ref after H01
        env:
          FALLLINE_RELEASE_SOURCE: ab24ebff2aa77cd71d1539a2aaeedaf157971265
          FALLLINE_RETIRE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FALLLINE_RETIRE_OUTPUT: ${{ runner.temp }}/fallline-generated-retirement-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 tests/scripts/retire-generated-v1.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fallline-generated-retirement
          path: ${{ runner.temp }}/fallline-generated-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
