name: Temporary Fallline gameplay acceptance
on:
  push:
    branches: [qa/fallline-gameplay-20261105]
permissions:
  contents: read
concurrency:
  group: fallline-gameplay-20261105
  cancel-in-progress: false
jobs:
  gameplay:
    if: github.event_name == 'push' && github.repository == 'alvarovillalbaa/fallline' && github.event.repository.private == false && github.ref == 'refs/heads/qa/fallline-gameplay-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      SOURCE_COMMIT: 9dfed1a5522697befb870c023ee76e1de34146ca
      FALLLINE_EXPECTED_DEPLOYMENT: dpl_BcRo1QPuz4r74feAP4FgYEhqM2Nv
      FALLLINE_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Run only the pinned public gameplay packet
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$FALLLINE_EXPECTED_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          node scripts/run-browser-gameplay.mjs --source-commit "$SOURCE_COMMIT"
